name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Sets the DASHSCOPE_API_KEY secret at runtime. The pipeline calls
# Qwen3.7-max via DashScope; without a key the smoke test cannot run.
# Configure this secret in repo Settings → Secrets and variables → Actions.

jobs:
  smoke-test:
    name: Pipeline smoke test (default prompt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install package (core dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install mesh + science extras
        run: pip install -e ".[mesh,science]"

      - name: Verify import
        run: |
          python -c "import multi_agent_cad; print('multi_agent_cad', multi_agent_cad.__version__)"
          python -c "from multi_agent_cad.graph import build_graph; print('build_graph OK')"

      - name: Run pipeline (default prompt)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "DASHSCOPE_API_KEY secret not set — skipping pipeline run (import check above still verifies the package)."
            exit 0
          fi
          python -m multi_agent_cad.graph

      - name: Verify generated artifacts
        if: ${{ env.DASHSCOPE_API_KEY != '' }}
        run: |
          set -e
          step_count=$(find . -maxdepth 2 -name "temp_output*.step" -type f 2>/dev/null | wc -l)
          stl_count=$(find . -maxdepth 2 -name "temp_output*.stl" -type f 2>/dev/null | wc -l)
          echo "STEP files generated: $step_count"
          echo "STL  files generated: $stl_count"
          if [ "$step_count" -lt 1 ] || [ "$stl_count" -lt 1 ]; then
            echo "Pipeline did not produce STEP/STL artifacts."
            exit 1
          fi

      - name: Upload generated models
        if: ${{ env.DASHSCOPE_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cad-artifacts
          path: |
            **/temp_output*.step
            **/temp_output*.stl
            pipeline_cache/*.json
          if-no-files-found: warn
          retention-days: 14
